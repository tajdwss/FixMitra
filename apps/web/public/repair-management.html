<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FixMitra Repair Details</title><style>body{font-family:system-ui;margin:0;background:#f4f7fb;color:#172033}main{max-width:880px;margin:auto;padding:28px}section{background:#fff;padding:20px;border:1px solid #e5eaf0;border-radius:14px;margin-top:16px}input,textarea,select,button{font:inherit;padding:11px;border:1px solid #d6dee8;border-radius:8px;margin:5px;width:calc(50% - 14px)}textarea{width:calc(100% - 14px);min-height:90px}button{background:#007c6d;color:#fff;border:0;font-weight:700}.notice{color:#007c6d;font-weight:700}</style></head><body><main><h1>FixMitra Repair Management</h1><p>Diagnosis, estimate, payment और warranty update करें।</p><section><select id="job"></select><textarea id="diagnosis" placeholder="Technician Diagnosis / Repair Notes"></textarea><input id="estimate" type="number" placeholder="Revised Estimate"><input id="advance" type="number" placeholder="Advance Received"><input id="final" type="number" placeholder="Final Amount"><input id="warranty" type="number" placeholder="Warranty Days"><input id="delivery" type="datetime-local"><button onclick="save()">Save Repair Details</button><p id="notice" class="notice"></p></section></main><script>const a=JSON.parse(localStorage.getItem('fixmitra_auth')||'null'),api='https://fixmitra-api.onrender.com',h={'Content-Type':'application/json',Authorization:'Bearer '+(a&&a.token)};if(!a)location.href='/';let jobs=[];async function load(){let r=await fetch(api+'/api/repair-jobs',{headers:h});jobs=await r.json();job.innerHTML=jobs.map(x=>`<option value="${x.id}">${x.ticket_no} — ${x.customer_name}</option>`).join('')}async function save(){let n=x=>x.value===''?undefined:Number(x.value),d={diagnosis:diagnosis.value||undefined,estimatedAmount:n(estimate),advanceAmount:n(advance),finalAmount:n(final),warrantyDays:n(warranty),expectedDeliveryAt:delivery.value?new Date(delivery.value).toISOString():undefined};let r=await fetch(api+'/api/repair-jobs/'+job.value+'/details',{method:'PATCH',headers:h,body:JSON.stringify(d)}),x=await r.json();notice.textContent=r.ok?'Repair financials और warranty save हो गए।':x.message}load()</script></body></html>
