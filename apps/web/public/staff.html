<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FixMitra Staff</title><style>body{font-family:system-ui;margin:0;background:#f4f7fb;color:#172033}main{max-width:960px;margin:auto;padding:28px}header{display:flex;justify-content:space-between;align-items:center}small{color:#007c6d;font-weight:800}section{background:#fff;border:1px solid #e5eaf0;border-radius:14px;padding:18px;margin-top:18px}form{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}input,select,button{font:inherit;padding:11px;border:1px solid #d6dee8;border-radius:8px}button{background:#007c6d;color:#fff;border:0;font-weight:700;cursor:pointer}.full{grid-column:1/-1}table{width:100%;border-collapse:collapse;margin-top:12px}td,th{padding:10px;text-align:left;border-bottom:1px solid #edf0f4}.notice{color:#007c6d;font-weight:700}@media(max-width:600px){form{grid-template-columns:1fr}main{padding:16px}}</style></head><body><main><header><div><small>FIXMITRA</small><h1>Staff & Assignment</h1></div><button onclick="location.href='/'">Repair Desk</button></header><section><h2>नया Staff Account</h2><form id="staffForm"><input name="name" placeholder="Staff Name" required><input name="phone" placeholder="Mobile Number" required><select name="role"><option value="TECHNICIAN">Technician</option><option value="RECEPTION">Reception</option><option value="SALES">Sales</option><option value="ACCOUNTANT">Accountant</option><option value="MANAGER">Manager</option></select><input name="password" type="password" minlength="8" placeholder="Temporary Password" required><button class="full">Create Staff Account</button></form><p id="notice" class="notice"></p></section><section><h2>Assign Technician</h2><form id="assignForm"><select id="job" required></select><select id="technician" required></select><button>Assign Job</button></form></section><section><h2>Current Staff</h2><table><thead><tr><th>Name</th><th>Mobile</th><th>Role</th><th>Status</th></tr></thead><tbody id="staffRows"></tbody></table></section></main><script>const a=JSON.parse(localStorage.getItem('fixmitra_auth')||'null');const api='https://fixmitra-api.onrender.com';const h={'Content-Type':'application/json',Authorization:'Bearer '+(a&&a.token)};if(!a)location.href='/';let staff=[];async function load(){let[r,s]=await Promise.all([fetch(api+'/api/repair-jobs',{headers:h}),fetch(api+'/api/staff',{headers:h})]);let jobs=await r.json();staff=await s.json();document.querySelector('#staffRows').innerHTML=staff.map(x=>`<tr><td>${x.name}</td><td>${x.phone}</td><td>${x.role}</td><td>${x.is_active?'Active':'Inactive'}</td></tr>`).join('');document.querySelector('#job').innerHTML=jobs.map(x=>`<option value="${x.id}">${x.ticket_no} — ${x.customer_name}</option>`).join('');document.querySelector('#technician').innerHTML=staff.filter(x=>x.role==='TECHNICIAN'&&x.is_active).map(x=>`<option value="${x.id}">${x.name} · ${x.phone}</option>`).join('')||'<option>No technician created yet</option>'}document.querySelector('#staffForm').onsubmit=async e=>{e.preventDefault();let v=Object.fromEntries(new FormData(e.target));let r=await fetch(api+'/api/staff',{method:'POST',headers:h,body:JSON.stringify(v)}),d=await r.json();document.querySelector('#notice').textContent=r.ok?'Staff account बना दिया गया।':d.message; if(r.ok){e.target.reset();load()}};document.querySelector('#assignForm').onsubmit=async e=>{e.preventDefault();let id=document.querySelector('#job').value,assignedTo=document.querySelector('#technician').value;let r=await fetch(api+'/api/repair-jobs/'+id+'/assignment',{method:'PATCH',headers:h,body:JSON.stringify({assignedTo})}),d=await r.json();document.querySelector('#notice').textContent=r.ok?'Repair job technician को assign हो गया।':d.message};load()</script></body></html>
